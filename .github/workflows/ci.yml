name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    name: Rust workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Run CI
        run: mise run ci
