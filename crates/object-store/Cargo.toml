[package]
name = "era-object-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1"
era-core = { path = "../core" }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "rt-multi-thread"] }
tracing = "0.1"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "blob_delta"
harness = false
