[package]
name = "era-repository"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
era-core = { path = "../core" }
era-materialization = { path = "../materialization" }
era-object-store = { path = "../object-store" }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "rt-multi-thread", "time"] }
tracing = "0.1"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "snapshot"
harness = false

[[bench]]
name = "snapshot_large"
harness = false
